
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none">

  <title>Intelligent Farm Logic</title>
  <desc>
    Modern agricultural technology favicon
    featuring a growing plant.
  </desc>

  <defs>
    <linearGradient id="farmGradient"
                    x1="0" y1="0"
                    x2="64" y2="64"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="1" y="1"
        width="62" height="62"
        rx="15"
        fill="url(#farmGradient)"/>

  <!-- Left leaf -->
  <path d="M32 39
           C20 39 13 32 13 21
           C25 21 32 28 32 39Z"
        fill="#BBF7D0"/>

  <!-- Right leaf -->
  <path d="M32 32
           C32 20 39 13 51 13
           C51 25 44 32 32 32Z"
        fill="#FFFFFF"/>

  <!-- Main stem -->
  <path d="M32 50V30"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M21 51H43"
        stroke="#BBF7D0"
        stroke-width="3"
        stroke-linecap="round"/>

</svg>
